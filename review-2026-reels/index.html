  <style>
/* 2026 Unwrapped · story edition */
:root {
  --bg: #07060d;
  --ink: #f4f1ff;
  --ink-2: #c9c3e0;
  --ink-3: #8d86a8;
  --coral: #ff6b6b;
  --mint: #4ee6b8;
  --violet: #a78bfa;
  --gold: #ffd166;
  --sky: #6cc5ff;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }

.stage {
  min-height: 100dvh; display: grid; place-items: center; gap: 14px; padding: 24px 16px;
  background:
    radial-gradient(800px 500px at 15% 10%, rgba(167,139,250,.22), transparent 60%),
    radial-gradient(700px 500px at 85% 90%, rgba(78,230,184,.16), transparent 60%),
    var(--bg);
}
.stage-note { font-size: .8rem; color: var(--ink-3); text-align: center; }
.stage-note a { color: var(--ink-2); }

.phone {
  position: relative; width: min(430px, 100vw); height: min(100dvh - 90px, 900px); aspect-ratio: 9 / 18;
  border-radius: 32px; overflow: hidden; background: #0d0b17; border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 8px rgba(255,255,255,.03);
}
@media (max-width: 480px) {
  .stage { padding: 0; gap: 0; }
  .stage-note { display: none; }
  .phone { width: 100vw; height: 100dvh; border-radius: 0; border: 0; box-shadow: none; aspect-ratio: auto; }
}

/* progress */
.progress { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 5; }
.progress .seg { flex: 1; height: 3px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
.progress .fill { height: 100%; width: 0; background: #fff; border-radius: 3px; }

/* top bar */
.bar { position: absolute; top: 22px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.who { display: flex; align-items: center; gap: 10px; font-size: .85rem; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, var(--coral), var(--violet)); border: 2px solid #fff; }
.ctrl { display: flex; gap: 6px; }
.icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.35); color: #fff; text-decoration: none; font-size: .8rem; backdrop-filter: blur(6px); }
.icon:hover { background: rgba(0,0,0,.55); }

/* tap zones */
.tap { position: absolute; top: 70px; bottom: 0; z-index: 4; cursor: pointer; }
.tap.left { left: 0; width: 34%; }
.tap.right { right: 0; width: 66%; }
.hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; color: rgba(255,255,255,.7);
  background: rgba(0,0,0,.4); padding: 7px 12px; border-radius: 999px; transition: opacity .6s; white-space: nowrap;
}
.hint.hide { opacity: 0; }
.paused-badge {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
  font-family: var(--mono); font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: #fff;
  background: rgba(0,0,0,.55); padding: 12px 18px; border-radius: 999px; opacity: 0; transition: opacity .25s;
}
.paused .paused-badge { opacity: 1; }

/* cards */
.cards { position: absolute; inset: 0; }
.card {
  position: absolute; inset: 0; padding: 84px 28px 60px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
  opacity: 0; transform: translateX(28px) scale(.985); transition: opacity .38s ease, transform .5s cubic-bezier(.2,.7,.2,1); pointer-events: none;
}
.card.active { opacity: 1; transform: none; }
.card.active .in { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
.card.active .in:nth-child(2) { animation-delay: .08s; }
.card.active .in:nth-child(3) { animation-delay: .16s; }
.card.active .in:nth-child(4) { animation-delay: .24s; }
.card.active .in:nth-child(5) { animation-delay: .32s; }
.card.active .in:nth-child(6) { animation-delay: .4s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* themes */
.t-cover { background: radial-gradient(120% 80% at 50% 110%, rgba(167,139,250,.55), transparent 60%), linear-gradient(170deg, #1a1430, #0b0a12); }
.t-coral { background: linear-gradient(170deg, #3a1521, #140a12); }
.t-gold { background: linear-gradient(170deg, #3a2d10, #14110a); }
.t-sky { background: linear-gradient(170deg, #0f2a3f, #0a1018); }
.t-mint { background: linear-gradient(170deg, #0f3328, #0a1612); }
.t-violet { background: linear-gradient(170deg, #26184a, #0f0b1c); }
.t-ink { background: linear-gradient(170deg, #1c1a26, #0b0a12); }

.kicker { font-family: var(--mono); font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.card h1 { font-family: var(--serif); font-weight: 500; letter-spacing: -.03em; line-height: 1; font-size: clamp(2rem, 8.6vw, 2.75rem); }
.card h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -.02em; line-height: 1.05; font-size: clamp(1.8rem, 8vw, 2.5rem); }
.card .grad { background: linear-gradient(90deg, var(--coral), var(--gold), var(--mint), var(--sky), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card p { color: var(--ink-2); font-size: 1rem; }
.card .mood { font-family: var(--serif); font-style: italic; font-size: 1.25rem; color: var(--ink); }
.card .small { font-size: .82rem; color: var(--ink-3); }
.nowrap { white-space: nowrap; }

.bignum { display: grid; gap: 18px; }
.bignum .n { font-family: var(--serif); font-weight: 600; letter-spacing: -.04em; line-height: 1; font-size: clamp(3.2rem, 15vw, 4.6rem); font-variant-numeric: tabular-nums; }
.bignum .l { font-size: .95rem; color: var(--ink); margin-top: 2px; }
.bignum .s { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.c-coral { color: var(--coral); } .c-mint { color: var(--mint); } .c-violet { color: var(--violet); } .c-gold { color: var(--gold); } .c-sky { color: var(--sky); }

.list { list-style: none; display: grid; gap: 10px; }
.list li { padding-left: 18px; position: relative; color: var(--ink-2); font-size: .95rem; }
.list li::before { content: "◆"; position: absolute; left: 0; top: .35em; font-size: .55rem; color: var(--acc, var(--violet)); }
.badge { display: inline-block; font-family: var(--mono); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--acc, var(--violet)); color: var(--acc, var(--violet)); width: max-content; }

.wave { height: 150px; }
.wave svg { width: 100%; height: 100%; overflow: visible; }
.eralist { list-style: none; display: grid; gap: 8px; }
.eralist li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); color: var(--ink-3); font-size: .9rem; }
.eralist li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); opacity: .5; }
.eralist li .g { font-family: var(--mono); font-size: .7rem; }
.eralist li.on { background: rgba(255,255,255,.07); border-color: var(--acc); color: var(--ink); }
.eralist li.on .dot { opacity: 1; box-shadow: 0 0 12px var(--acc); }
.eralist li.on .t { font-family: var(--serif); font-size: 1.05rem; }
.eralist li.done { opacity: .55; }
.bars { display: grid; gap: 12px; }
.bars .row { display: grid; grid-template-columns: 56px 1fr 48px; gap: 10px; align-items: center; font-family: var(--mono); font-size: .78rem; }
.bars .trk { height: 12px; background: rgba(255,255,255,.1); border-radius: 6px; position: relative; overflow: hidden; }
.bars .v1 { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.25); width: 0; transition: width .9s cubic-bezier(.2,.7,.2,1); }
.bars .v2 { position: absolute; inset: 0 auto 0 0; background: var(--mint); width: 0; transition: width 1.2s .2s cubic-bezier(.2,.7,.2,1); }
.card.active .bars .v1, .card.active .bars .v2 { width: var(--w); }

.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.duel .m { font-family: var(--serif); font-size: clamp(2.2rem, 11vw, 3rem); letter-spacing: -.03em; line-height: 1; }
.duel .vs { font-family: var(--mono); color: var(--ink-3); font-size: .8rem; }
.duel .n { font-size: .78rem; color: var(--ink-3); margin-top: 6px; }
.facts { display: grid; gap: 8px; }
.facts div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: .9rem; color: var(--ink-2); }
.facts b { color: var(--ink); font-weight: 600; }

.steps3 { display: grid; gap: 10px; }
.steps3 div { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.06); }
.steps3 i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #0b0a12; background: var(--mint); }
.steps3 b { display: block; font-size: .95rem; }
.steps3 span { font-size: .82rem; color: var(--ink-3); }

.quotes { display: grid; gap: 12px; }
.quotes .q { padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.06); }
.quotes .stars { color: var(--gold); letter-spacing: 2px; font-size: .75rem; }
.quotes p { font-family: var(--serif); font-size: 1.05rem; color: var(--ink); line-height: 1.3; margin: 6px 0 8px; }
.quotes .w { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.quotes .w a { color: inherit; text-decoration: underline; text-underline-offset: 3px; pointer-events: auto; }
/* the whole block rises above the tap zones; only the links take taps */
.card.active .quotes { position: relative; z-index: 7; }

.score { display: grid; gap: 8px; }
.score .g { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: .88rem; }
.status { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid; }
.status.great { color: var(--mint); border-color: rgba(78,230,184,.6); }
.status.good { color: var(--sky); border-color: rgba(108,197,255,.6); }
.status.ok { color: var(--violet); border-color: rgba(167,139,250,.6); }
.status.warn { color: var(--gold); border-color: rgba(255,209,102,.6); }
.rating { margin-top: 6px; padding: 14px; border-radius: 16px; background: rgba(78,230,184,.12); border: 1px solid rgba(78,230,184,.5); }
.rating b { font-family: var(--serif); font-size: 1.5rem; font-weight: 500; color: var(--mint); display: block; }
.rating span { font-size: .8rem; color: var(--ink-2); }

.traits { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-family: var(--mono); font-size: .74rem; padding: 7px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: var(--ink-2); }

.cta { display: grid; gap: 10px; pointer-events: auto; }
.btn { display: block; text-align: center; padding: 13px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem; }
.btn.primary { background: #fff; color: #0b0a12; border-color: #fff; }
.card.active .cta { position: relative; z-index: 7; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>

  function waveSVG(active) {
    const W = 360, H = 150;
    const intensity = [0.55, 0.7, 0.95, 0.9, 0.85, 0.3, 0.28, 0.3, 0.32, 0.9, 1.0, 0.8];
    const stepX = W / 11;
    const pts = intensity.map((v, i) => [i * stepX, H - 26 - v * (H - 60)]);
    const path = pts.map((p, i) => (i ? `S ${p[0] - stepX / 2} ${p[1]}, ${p[0]} ${p[1]}` : `M ${p[0]} ${p[1]}`)).join(" ");
    const bands = [[0, 2], [3, 4], [5, 8], [9, 11]];
    const rects = bands.map(([a, b], i) => {
      const x0 = a * stepX - (a ? stepX / 2 : 0), x1 = b * stepX + (b < 11 ? stepX / 2 : 0);

  const fills = cards.map(() => { const seg = document.createElement("div"); seg.className = "seg"; const f = document.createElement("div"); f.className = "fill"; seg.appendChild(f); progress.appendChild(seg); return f; });

  /* ---------- engine ---------- */
  let idx = -1, elapsed = 0, last = null, userPaused = reduced, holding = false, hidden = false;
  const paused = () => userPaused || holding || hidden;
  const pauseBtn = $("#pause");
  function reflectPause() { phone.classList.toggle("paused", paused() && cards[idx].dur > 0); pauseBtn.textContent = userPaused ? "▶" : "❚❚"; pauseBtn.setAttribute("aria-label", userPaused ? "Play" : "Pause"); }

  function countUp(card) {
    $$(".count", card).forEach((n) => {
      const target = +n.dataset.target;
      if (reduced) { n.textContent = fmt.format(target); return; }
      const t0 = performance.now(), dur = 1300;
      (function tick(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); n.textContent = fmt.format(Math.round(target * e)); if (p < 1) requestAnimationFrame(tick); })(t0);
    });
  }
  function show(i) {
    idx = Math.max(0, Math.min(cards.length - 1, i));
    elapsed = 0;
    els.forEach((c, j) => c.classList.toggle("active", j === idx));
    fills.forEach((f, j) => (f.style.width = j < idx ? "100%" : "0%"));
    countUp(els[idx]);
    reflectPause();
  }
  const next = () => (idx < cards.length - 1 ? show(idx + 1) : null);
  const prev = () => (elapsed > 1500 ? show(idx) : show(idx - 1));

  function loop(t) {
    if (last == null) last = t;
    const dt = t - last; last = t;
    const dur = cards[idx].dur;
    if (dur > 0) {
      if (!paused()) elapsed += dt;
      fills[idx].style.width = Math.min(100, (elapsed / dur) * 100) + "%";
      if (elapsed >= dur) next();
    } else fills[idx].style.width = "100%";
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  let holdTimer = null;
  function down(e) { e.preventDefault(); clearTimeout(holdTimer); holdTimer = setTimeout(() => { holding = true; reflectPause(); }, 180); }
  function up(dir) { return (e) => { e.preventDefault(); clearTimeout(holdTimer); if (holding) { holding = false; reflectPause(); return; } dir === "next" ? next() : prev(); hideHint(); }; }
  function cancel() { clearTimeout(holdTimer); if (holding) { holding = false; reflectPause(); } }
  const L = $("#prev"), R = $("#next");

  L.addEventListener("pointerup", up("prev")); R.addEventListener("pointerup", up("next"));

  document.addEventListener("visibilitychange", () => { hidden = document.hidden; reflectPause(); });
  $("#replay").addEventListener("click", (e) => { e.stopPropagation(); show(0); });

  const hint = $("#hint");
  let hintTimer = setTimeout(hideHint, 5000);
  function hideHint() { clearTimeout(hintTimer); hint.classList.add("hide"); }
  if (reduced) hint.textContent = "autoplay off · tap or use ← → to move";

  show(0);
  requestAnimationFrame(loop);
})();

</script>
</body>
</html>
